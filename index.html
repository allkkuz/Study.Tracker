  --f:"Geologica","Helvetica Neue",Helvetica,Arial,sans-serif; --fn:var(--f); --hw:300; --kw:400;
  --mark:var(--ink); --mark2:var(--half); --bad:var(--ink2); --trend:var(--ink2); --target:var(--ink); --boxc:var(--ink);
  --sk-listening:var(--mark); --sk-reading:var(--mark); --sk-speaking:var(--mark); --sk-writing:var(--mark); --sk-grammar:var(--mark);
  --s1:12px; --s2:14px; --s3:16px; --s4:20px; --s5:28px; --s6:clamp(56px,14vw,84px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E0F11; --ink:#ECEDEF; --ink2:#C2C5CB; --muted:#878C95; --line:#25282D; --faint:#17191C; --half:#5F636B; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#0E0F11; --ink:#ECEDEF; --ink2:#C2C5CB; --muted:#878C95; --line:#25282D; --faint:#17191C; --half:#5F636B; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--s3)/1.5 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.muted{color:var(--muted)}
.screen{display:grid;gap:40px;padding-top:28px}
h2{font:500 var(--s2)/1.3 var(--f);color:var(--muted);margin:0 0 14px}
.sub{font-size:var(--s2);color:var(--muted);margin:-6px 0 16px;max-width:60ch}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--line)}
.link:hover{text-decoration-color:currentColor}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 18px;font-weight:500;font-size:var(--s2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.brand{font-weight:500;font-size:var(--s3);margin:0}
.left{font-size:var(--s2);color:var(--muted)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:26px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;border-bottom:1.5px solid transparent;margin-bottom:-1px;padding:13px 0 12px;font-size:var(--s3);color:var(--muted);white-space:nowrap}
.nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.status{font-size:var(--s1);color:var(--muted);margin-top:10px}
.status.bad{color:var(--ink);font-weight:500}

/* today */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:end}
.hero-n{font:var(--hw) var(--s6)/.82 var(--fn);letter-spacing:-.04em}
.hero-t{padding-bottom:4px;min-width:0}
.hero-t b{display:block;font:500 var(--s4)/1.2 var(--f)}
.hero-t span{font-size:var(--s2);color:var(--muted)}
.hero-nav{display:flex;gap:6px;padding-bottom:2px}
.icon{width:40px;height:40px;border:1px solid var(--line);background:transparent;border-radius:50%;display:grid;place-items:center}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}
.icon:disabled{opacity:.3;cursor:default}
.meter{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:var(--s2);color:var(--muted)}
.meter b{font-weight:500;color:var(--ink);font-size:var(--s3)}
.bar{position:relative;height:2px;background:var(--line);margin-top:10px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--mark)}
.bar u{position:absolute;top:-5px;bottom:-5px;width:1.5px;background:var(--muted)}
.list{border-top:1px solid var(--line)}
.item-r{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px;border-bottom:1px solid var(--line)}
.item{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr);gap:14px;align-items:start;padding:16px 0;background:none;border:0;text-align:left}
.item-r .ed-mn{background:none;border:0;padding:19px 0 8px;text-decoration:underline dotted;text-underline-offset:4px;text-decoration-color:var(--half)}
.item-r .ed-mn.diff{color:var(--ink)}
.minedit{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:4px 0 16px 36px;border-bottom:1px solid var(--line);font-size:var(--s2)}
.bar.segs{height:4px;border-radius:2px;overflow:hidden}
.bar.segs i{border-radius:0}
.box{width:20px;height:20px;border:1.5px solid var(--boxc);border-radius:5px;margin-top:2px;position:relative;transition:background .12s}
.item[aria-checked="true"] .box{background:var(--c, var(--mark));border-color:var(--c, var(--mark))}
.item[aria-checked="true"] .box::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid var(--bg);border-width:0 1.75px 1.75px 0;transform:rotate(45deg)}
.txt{display:grid;gap:2px;min-width:0}
.nm{font-weight:500}
.nm em{font-style:normal;font-weight:400;color:var(--muted);font-size:var(--s2)}
.rs{font-size:var(--s2);color:var(--muted);overflow-wrap:anywhere}
.mn{font-size:var(--s2);color:var(--muted);padding-top:1px;white-space:nowrap}
.item-r:has(.item[aria-checked="true"]) .mn{color:var(--ink)}
.item:disabled{cursor:default}
.dim .item .nm,.dim .mn{color:var(--muted)}
.more{font-size:var(--s2);color:var(--muted);padding-top:14px;line-height:1.9}
.more .link{color:var(--ink);margin-right:10px}
.notice{border:1px solid var(--line);border-radius:10px;padding:18px 18px 4px}
.notice b{font-weight:500}
.notice p{margin:4px 0 6px;font-size:var(--s2);color:var(--muted)}
.notice .item-r:last-child{border-bottom:0}
.notice .list{margin-top:6px}
.field{display:grid;gap:6px;font-size:var(--s2);color:var(--muted)}
.plain{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:8px 0;color:var(--ink);font-size:var(--s3);resize:vertical;min-height:40px}
textarea.plain{min-height:64px}
.plain:focus{outline:none;border-bottom-color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.wd{display:grid;justify-items:center;gap:6px;padding:12px 0 10px;background:none;border:0}
.wd small{font-size:var(--s1);color:var(--muted)}
.wd span{font:300 var(--s4)/1 var(--f);padding-bottom:4px;border-bottom:1.5px solid transparent}
.wd[aria-current="date"] span{border-bottom-color:var(--ink)}
.wd.is-today span{font-weight:500}
.wd:disabled{opacity:.25;cursor:default}

/* state marks (shared) */
.mk{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--faint)}
[data-st="full"]>.mk,.cell[data-st="full"],.lg[data-st="full"]{background:var(--mark)}
[data-st="part"]>.mk,.cell[data-st="part"],.lg[data-st="part"]{background:var(--mark2)}
[data-st="miss"]>.mk,.cell[data-st="miss"],.lg[data-st="miss"]{background:transparent;box-shadow:inset 0 0 0 1px var(--bad)}
[data-st="today"]>.mk,.cell[data-st="today"],.lg[data-st="today"]{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
[data-st="future"]>.mk,.cell[data-st="future"],.lg[data-st="future"],[data-st="rest"]>.mk,.cell[data-st="rest"]{background:var(--faint)}
[data-st="off"]>.mk,.cell[data-st="off"],.lg[data-st="off"]{background:repeating-linear-gradient(45deg,var(--line) 0 1px,transparent 1px 3px)}
.cell[data-st="out"]{background:transparent;visibility:hidden}

/* dashboard */
.goal-line,.debt{margin:0;font-size:var(--s2);color:var(--muted)}
.debt{margin-top:16px}
.debt .link{color:var(--ink);margin-left:4px}
.goal-line .link{color:var(--ink);margin-left:4px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big b{font:var(--hw) var(--s6)/.9 var(--fn);letter-spacing:-.03em;font-variant-numeric:proportional-nums}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;border-top:1px solid var(--line);margin-top:26px;padding-top:16px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:0}
.kpis div{display:grid;gap:4px;align-content:start;min-width:0}
.kpis b{font:var(--kw) var(--s5)/1.1 var(--fn);font-variant-numeric:proportional-nums;white-space:nowrap}
.kpis span{font-size:var(--s1);color:var(--muted);line-height:1.35}
.keys{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:var(--s1);color:var(--muted);margin:-4px 0 10px}
.keys svg,.keys .bk{margin-left:10px}
.keys > :first-child{margin-left:0}
.bk{display:inline-block;width:10px;height:10px;border-radius:2px}
.bk.f{background:var(--mark)}
.bk.g{background:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.keys line{stroke-width:2;stroke-linecap:round}
.k-ln{stroke:var(--mark)}
.k-pl{stroke:var(--muted);stroke-dasharray:4 3}
.k-fc{stroke:var(--mark);stroke-dasharray:1 3.5}
.chartbox{overflow:hidden}
.chart .pl{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.chart .fc{fill:none;stroke:var(--mark);stroke-width:2;stroke-dasharray:.5 4;stroke-linecap:round}
.chart .ln{fill:none;stroke:var(--mark);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .wash{fill:var(--mark);opacity:.07}
.chart .dot{fill:var(--mark);stroke:var(--bg);stroke-width:2}
.chart .today{stroke:var(--half);stroke-width:1}
.chart .xh{stroke:var(--muted);stroke-width:1}
.chart .hit{fill:transparent}
.chart .ghost{fill:var(--faint)}
.chart .fact{fill:var(--mark)}
.chart .col.cur .ghost{fill:var(--line)}
.chart .col:hover .fact,.chart .col:focus .fact{opacity:.75}
.chart .col:hover .ghost,.chart .col:focus .ghost{fill:var(--line)}
.chart .col:focus{outline:none}
.chart .col:focus-visible .hit{stroke:var(--ink);stroke-width:1}
.chart .lab{fill:var(--ink);font:500 11px var(--f)}
.chart .trend{fill:none;stroke:var(--trend);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.chart .fact.bad{fill:var(--bad)}
.k-tr{stroke:var(--trend)}
.k-tg{stroke:var(--target);stroke-dasharray:1 3.5}
.h3{font:500 var(--s2)/1.3 var(--f);margin:26px 0 10px}
.lead{margin:0;font-size:var(--s3);max-width:60ch}
.quote{margin:16px 0 0;padding-left:14px;border-left:2px solid var(--line);font-size:var(--s2);color:var(--ink2);white-space:pre-line;max-width:60ch}
.sum-h{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:18px}
.sum-h div{display:grid;gap:2px}
.sum-h b{font:500 var(--s4)/1.2 var(--f)}
.sum-h span{font-size:var(--s2);color:var(--muted)}
table.cmp{min-width:0}
table.cmp td:first-child{color:var(--muted)}
.chart .lab.mu{fill:var(--muted);font-weight:400}
.tblv summary{cursor:pointer;font-size:var(--s2);color:var(--muted);margin-top:12px;list-style:none;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.tblv summary::-webkit-details-marker{display:none}
.tblv[open] summary{margin-bottom:8px}
.scoped{display:grid;gap:36px;border-top:1px solid var(--ink);padding-top:18px}
.seg{display:flex;gap:22px;font-size:var(--s3)}
.seg button{background:none;border:0;padding:4px 0;color:var(--muted);border-bottom:1.5px solid transparent}
.seg button[aria-checked="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.hbs{display:grid;gap:14px}
.hb{display:grid;gap:7px;outline-offset:4px}
.hb-t{display:flex;justify-content:space-between;gap:12px;font-size:var(--s2)}
.hb-t span:last-child{color:var(--muted);white-space:nowrap}
.hb-b{position:relative;height:8px}
.hb-b i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.hb-b .g{background:var(--faint)}
.hb-b .f{background:var(--c, var(--mark))}
.hb:hover .hb-b .f{opacity:.75}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.45;padding:8px 11px;border-radius:7px;max-width:240px}
.tip-h{opacity:.7;font-size:11.5px;margin-bottom:2px}
.sks{display:flex;flex-wrap:wrap;gap:4px}
.sks button{height:30px;padding:0 10px;border:1px solid var(--line);background:transparent;border-radius:6px;font-size:var(--s1);color:var(--muted)}
.sks button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.big span{color:var(--muted)}
.bar-note{display:flex;justify-content:space-between;gap:12px;font-size:var(--s1);color:var(--muted);margin-top:10px}
.rows{border-top:1px solid var(--line)}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--s2)}
.r span:first-child{color:var(--muted)}
.r b{font-weight:500;font-size:var(--s3)}
.hm{display:grid;gap:6px}
.hm-m,.hm-g{display:grid;gap:2px}
.hm-m{font-size:10.5px;color:var(--muted);height:14px}
.hm-m span{white-space:nowrap}
.hm-g{grid-template-rows:repeat(7,auto);grid-auto-flow:column}
.cell{aspect-ratio:1;border:0;border-radius:2px;padding:0;min-width:0}
.cell[aria-current="date"]{outline:1.5px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:var(--s1);color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;gap:7px;align-items:center}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px}
.wk{position:relative;height:120px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line)}
.wk button{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0;position:relative}
.wk button::before{content:"";position:absolute;left:0;right:0;bottom:0;height:83.333%;background:var(--faint)}
.wk button i{position:relative;width:100%;background:var(--ink)}
.wk button.cur::before{box-shadow:inset 0 0 0 1px var(--muted)}
.wk-100{position:absolute;left:0;right:0;bottom:83.333%;border-top:1px dashed var(--half);pointer-events:none}
.wk-x{display:grid;gap:2px;font-size:10.5px;color:var(--muted);margin-top:6px}
.wk-x span{white-space:nowrap}
.act-r{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.act-r div{display:flex;justify-content:space-between;gap:12px;font-size:var(--s2)}
.act-r div span:last-child{color:var(--muted)}
.act-r .bar{margin-top:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:440px;font-size:var(--s2)}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:400;color:var(--muted);font-size:var(--s1)}
td.n,th.n{text-align:right;padding-right:0;padding-left:12px}

/* tests */
.goal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:18px}
select.plain{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--line)}
.path div{padding:14px 0;display:grid;gap:2px}
.path small{font-size:var(--s1);color:var(--muted)}
.path b{font:var(--hw) var(--s5)/1.1 var(--fn)}
.path b span{font-size:var(--s3);color:var(--muted);font-weight:400;margin-left:6px}
.scale{display:grid;grid-template-columns:30fr 10fr 10fr 10fr 10fr 30fr;font-size:var(--s1);color:var(--muted);border-top:1px solid var(--line)}
.scale div{padding:8px 0 0;border-left:1px solid var(--line);padding-left:6px;display:grid}
.scale div:first-child{border-left:0;padding-left:0}
.scale div.hit{color:var(--ink);font-weight:500}
.chart{display:block;max-width:100%;height:auto}
.chart .band{fill:var(--faint)}
.chart .gl{stroke:var(--line)}
.chart .ax{fill:var(--muted);font:400 11px var(--f)}
.chart .goal{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.chart .traj{fill:none;stroke:var(--target);stroke-width:2;stroke-dasharray:.5 4;stroke-linecap:round}
.shift{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:var(--s2);margin-top:14px}
.goal-st{margin:0;font-size:var(--s4);line-height:1.3}
.goal-st b{font-weight:500}
.verdict{margin:0 0 14px;font-size:var(--s3);font-weight:500;max-width:60ch}
#g-calc .r b,#g-plan .r b{font-size:var(--s2);text-align:right}
.path div small:last-child{margin-top:2px}
.scale div.tg span:first-child{color:var(--ink)}
.chart .ln{fill:none;stroke:var(--mark);stroke-width:1.5}
.chart .pt{fill:var(--bg);stroke:var(--mark);stroke-width:1.5}
.chart .pv{fill:var(--ink);font:500 11px var(--f)}
.chart .empty{fill:var(--muted);font:400 13px var(--f)}
details.ck{border-bottom:1px solid var(--line)}
details.ck summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:14px 0;cursor:pointer}
details.ck summary::-webkit-details-marker{display:none}
.ck-n{font-weight:500}
.ck-w{font-size:var(--s2);color:var(--muted)}
.ck-r{grid-row:1/3;grid-column:2;text-align:right;align-self:center}
.ck-r small{display:block;font-size:var(--s1);color:var(--muted)}
.ck-body{display:grid;gap:18px;padding:4px 0 24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:18px}
.checks{display:flex;flex-wrap:wrap;gap:8px 28px}
.cbx{display:inline-flex;gap:10px;align-items:center;font-size:var(--s3);color:var(--ink);cursor:pointer}
.cbx input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:5px;margin:0;display:grid;place-items:center;flex:none}
.cbx input:checked{background:var(--ink)}
.cbx input:checked::after{content:"";width:5px;height:10px;border:solid var(--bg);border-width:0 1.75px 1.75px 0;transform:translate(0,-1px) rotate(45deg)}
.links{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:var(--s2)}

/* plan editor */
.pw .r > span:first-child{color:var(--ink);width:28px;flex:none}
.pw .r > span:nth-child(2){flex:1;color:var(--muted);min-width:0}
.pw .tot > span:first-child,.pw .tot > span:nth-child(2){color:var(--muted)}
.ed{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:12px}
.ed:first-child{border-top:1px solid var(--line)}
.ed-top{display:flex;gap:16px;align-items:center}
.ed-name{flex:1;min-width:0;font-weight:500;font-size:var(--s4)!important;border-bottom-color:transparent!important}
.ed-name:focus{border-bottom-color:var(--ink)!important}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:32px;height:32px;border:1px solid var(--line);background:transparent;border-radius:50%;font-size:16px;line-height:1}
.step input{width:46px;text-align:center;border:0;background:transparent;font-size:var(--s3);padding:4px 0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step span{font-size:var(--s2);color:var(--muted);margin-right:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:420px}
.days button{height:36px;border:1px solid var(--line);background:transparent;border-radius:6px;font-size:var(--s2);color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ed-foot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:var(--s2);color:var(--muted)}
.ed-foot .link.armed{color:var(--ink);font-weight:500}
.add{margin-top:18px}
.cfg{display:grid;gap:22px}
.inline{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 10px;font-size:var(--s3)}
.inline input.plain{width:64px;text-align:center}
.inline input[type="date"].plain{width:auto;text-align:left}
.ver{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--s2)}
.ver b{font-weight:500;font-size:var(--s3)}
.ver span{color:var(--muted)}
.savebar{position:sticky;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--ink);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.savebar .eff{display:flex;align-items:baseline;gap:8px;font-size:var(--s2);color:var(--muted);margin-right:auto}
.savebar .eff input{width:auto}
.msg{font-size:var(--s2);margin:12px 0 0}
.msg.bad{font-weight:500}
.export{margin:0}
#backup .export{padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.ct-list{border-top:1px solid var(--line)}
.ct{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.ct-t{display:grid;gap:2px;min-width:0}
.ct-t small,#cal-g small{font-size:var(--s1);color:var(--muted)}
.ct input.plain{width:auto;min-width:96px;text-align:right;font-size:var(--s3);padding:6px 0}
.inline input[type="time"].plain{width:auto;text-align:left}
.howto{margin-top:20px;display:grid;gap:8px;font-size:var(--s2);color:var(--muted);max-width:62ch}
.howto p{margin:0}
.howto b{font-weight:500;color:var(--ink)}
#cal-g .r > span:first-child{color:var(--ink);display:grid;gap:2px;min-width:0}
#cal-g a{font-size:var(--s2);white-space:nowrap}

@media (max-width:600px){
  .kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:480px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:auto 1fr;grid-template-areas:"n t" "nav nav"}
  .hero-n{grid-area:n}.hero-t{grid-area:t}.hero-nav{grid-area:nav}
  :root[data-design="route"] #p-today .hero{grid-template-columns:auto 1fr;grid-template-areas:"n t" "r nav"}
  :root[data-design="route"] .hero-ring-w{grid-area:r;width:60px;height:60px}
  :root[data-design="route"] .hero-nav{justify-content:flex-end;align-self:center}
  .hm-m{display:none}
  .path b{font-size:var(--s4)}
}

.sklegend{display:none}
.sklegend span{display:inline-flex;gap:7px;align-items:center}
.sklegend i{width:10px;height:10px;border-radius:50%;display:inline-block}
:root[data-design="route"] .cell[data-st="full"][style*="--c"]{background:var(--c)}
:root[data-design="route"] .cell[data-st="part"][style*="--c"]{background:var(--c);opacity:.45}

/* ===== «Маршрут»: the way to the goal as a metro line; skills are the lines' colours ===== */
.dayend{display:none}
.hero-ring-w{display:none}
/* «Графит»: a near-neutral interface; colour is kept for the five skills (balanced, colour-blind safe) and for misses */
:root[data-design="route"]{
  --f:"Onest","Helvetica Neue",Arial,sans-serif; --fd:"Unbounded","Onest",Arial,sans-serif; --fn:var(--fd); --hw:600; --kw:600;
  --s6:clamp(52px,12vw,80px);
  --bg:#FFFFFF; --ink:#1B1D22; --ink2:#42454D; --muted:#707480; --line:#E6E7EA; --faint:#F3F3F5; --half:#B9BCC4; --brand:#23262F; --on-brand:#FFFFFF; --acc:#23262F; --on-acc:#FFFFFF; --mark:#23262F; --mark2:#B9BCC4; --bad:#D9483B; --trend:#8B909C; --target:#23262F; --boxc:#1B1D22;
  --sk-listening:#3DA8D5; --sk-reading:#D2621F; --sk-speaking:#0F9466; --sk-writing:#CFA70C; --sk-grammar:#7D53B6;
}
@media (prefers-color-scheme: dark){ :root[data-design="route"]:not([data-theme="light"]){ --bg:#111215; --ink:#EDEEF1; --ink2:#C7C9CF; --muted:#8B8E97; --line:#2A2C32; --faint:#1A1B1F; --half:#4A4D57; --brand:#2C2F39; --on-brand:#FFFFFF; --acc:#E3E5EA; --on-acc:#111215; --mark:#E3E5EA; --mark2:#4A4D57; --bad:#F06A5C; --trend:#9AA0AA; --target:#E3E5EA; --boxc:#EDEEF1; color-scheme:dark; --sk-listening:#4B89C8; --sk-reading:#CC4D2A; --sk-speaking:#2C9267; --sk-writing:#B98E16; --sk-grammar:#704BC5; } }
:root[data-design="route"][data-theme="dark"]{ --bg:#111215; --ink:#EDEEF1; --ink2:#C7C9CF; --muted:#8B8E97; --line:#2A2C32; --faint:#1A1B1F; --half:#4A4D57; --brand:#2C2F39; --on-brand:#FFFFFF; --acc:#E3E5EA; --on-acc:#111215; --mark:#E3E5EA; --mark2:#4A4D57; --bad:#F06A5C; --trend:#9AA0AA; --target:#E3E5EA; --boxc:#EDEEF1; color-scheme:dark; --sk-listening:#4B89C8; --sk-reading:#CC4D2A; --sk-speaking:#2C9267; --sk-writing:#B98E16; --sk-grammar:#704BC5; }

/* type */
:root[data-design="route"] .brand{font:600 16px/1.2 var(--fd);letter-spacing:-.01em}
:root[data-design="route"] h2{font:600 15px/1.3 var(--fd);color:var(--ink);letter-spacing:-.01em;margin-bottom:16px}
:root[data-design="route"] .h3{font:500 13px/1.3 var(--fd)}
:root[data-design="route"] .big b{font-weight:700;letter-spacing:-.04em}
:root[data-design="route"] .kpis{border-top:0;padding-top:4px}
:root[data-design="route"] .kpis b{letter-spacing:-.03em;font-size:26px}
:root[data-design="route"] .goal-st{font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:-.02em}
:root[data-design="route"] .verdict{font-family:var(--fd);font-weight:500;font-size:15px;line-height:1.45}
:root[data-design="route"] .sum-h b{font-family:var(--fd);font-weight:600}

/* controls: signage — pills */
:root[data-design="route"] .nav button[aria-selected="true"]{border-bottom:3px solid var(--acc);padding-bottom:10px}
:root[data-design="route"] .btn{border-radius:999px;background:var(--acc);border-color:var(--acc);color:var(--on-acc);padding:11px 20px}
:root[data-design="route"] .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
:root[data-design="route"] .seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;border-radius:999px;background:var(--faint)}
:root[data-design="route"] .seg button{border:0;border-radius:999px;padding:7px 14px;font-size:var(--s2);color:var(--ink2);transition:background-color .25s,color .25s}
:root[data-design="route"] .seg button[aria-checked="true"]{background:var(--acc);color:var(--on-acc)}
:root[data-design="route"] .scoped{border-top:0;padding-top:0}
:root[data-design="route"] .scoped > .seg,:root[data-design="route"] #catchup .seg{justify-self:start}
:root[data-design="route"] .k-goal{fill:var(--bg);stroke:var(--ink);stroke-width:3.5}

/* Today: the date as a sign, the week and the day as lines with stations */
:root[data-design="route"] #p-today > *{order:3}
:root[data-design="route"] #p-today > .hero{order:0}
:root[data-design="route"] #p-today > div:has(#t-week){order:1}
:root[data-design="route"] #p-today > #t-main{order:2}
:root[data-design="route"] #p-today .hero{background:var(--brand);color:var(--on-brand);border-radius:28px;padding:24px 22px 22px 26px;align-items:end;position:relative;overflow:hidden}
:root[data-design="route"] #p-today .hero{grid-template-columns:auto 1fr auto auto}
:root[data-design="route"] .hero-ring-w{display:grid;place-items:center;position:relative;width:78px;height:78px;align-self:center}
:root[data-design="route"] .hero-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
:root[data-design="route"] .hr-bg{fill:none;stroke:rgba(255,255,255,.22);stroke-width:7}
:root[data-design="route"] .hr-fg{fill:none;stroke:var(--on-brand);stroke-width:7;stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
:root[data-design="route"] #d-pct{font:600 15px/1 var(--fd);color:var(--on-brand)}
:root[data-design="route"] .hero-n{font-weight:700;letter-spacing:-.05em;color:var(--on-brand)}
:root[data-design="route"] .hero-t b{font-family:var(--fd);font-weight:600;font-size:20px}
:root[data-design="route"] .hero-t span{color:rgba(255,255,255,.78)}
:root[data-design="route"] .hero .link{color:var(--on-brand);text-decoration-color:rgba(255,255,255,.5)}
:root[data-design="route"] .hero .icon{border-color:rgba(255,255,255,.45);color:var(--on-brand);position:relative;z-index:1}
:root[data-design="route"] #p-today > div:has(#t-week) h2{display:none}
:root[data-design="route"] .week{border-top:0}
:root[data-design="route"] .wd{position:relative;padding:8px 0 6px}
:root[data-design="route"] .wd:not(:last-child)::after{content:"";position:absolute;left:50%;width:100%;bottom:12px;height:4px;border-radius:2px;background:var(--line)}
:root[data-design="route"] .wd .mk{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--bg);box-shadow:none;position:relative;z-index:1}
:root[data-design="route"] .wd[data-st="full"] .mk{background:var(--mark);border-color:var(--mark)}
:root[data-design="route"] .wd[data-st="part"] .mk{background:linear-gradient(90deg,var(--mark) 50%,var(--bg) 50%);border-color:var(--mark)}
:root[data-design="route"] .wd[data-st="miss"] .mk{border-color:var(--bad)}
:root[data-design="route"] .wd[data-st="off"] .mk{background:repeating-linear-gradient(45deg,var(--line) 0 1px,var(--bg) 1px 3px)}
:root[data-design="route"] .wd.is-today .mk{border-color:var(--ink)}
:root[data-design="route"] .wd.is-today[data-st="full"] .mk{border-color:var(--mark)}
:root[data-design="route"] .wd span{font-family:var(--fd);font-weight:500;font-size:18px}
:root[data-design="route"] .bar.segs{height:12px;border-radius:6px;background:var(--faint);margin-top:12px}
:root[data-design="route"] .bar.segs i{border-radius:6px}
:root[data-design="route"] .meter b{font-family:var(--fd);font-size:18px}
:root[data-design="route"] .list{border-top:0}
:root[data-design="route"] #t-list{margin-top:14px!important}
:root[data-design="route"] .item-r{position:relative;border-bottom:0}
:root[data-design="route"] .item-r::before,:root[data-design="route"] .minedit::before,:root[data-design="route"] .dayend::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:4px;background:var(--line)}
:root[data-design="route"] #t-list > .item-r:first-child::before{top:28px}
:root[data-design="route"] .notice .item-r:first-child::before{top:28px}
:root[data-design="route"] .notice .item-r:last-child::before{bottom:calc(100% - 28px)}
:root[data-design="route"] .item-r:has(.item[aria-checked="true"])::before{background:var(--c)}
:root[data-design="route"] .item{grid-template-columns:22px minmax(0,1fr);gap:16px;padding:14px 0}
:root[data-design="route"] .box{width:22px;height:22px;border-radius:50%;border:4px solid var(--c,var(--mark));background:var(--bg);position:relative;z-index:1;margin-top:1px}
:root[data-design="route"] .item[aria-checked="true"] .box{background:var(--c,var(--mark));border-color:var(--c,var(--mark))}
:root[data-design="route"] .item[aria-checked="true"] .box::after{left:4.5px;top:1px;width:4px;height:9px;border-color:#fff}
:root[data-design="route"] .nm{font-size:17px}
:root[data-design="route"] .item-r .ed-mn{padding-top:17px}
:root[data-design="route"] .item-r > span.mn{padding-top:17px}
:root[data-design="route"] .minedit{position:relative;border-bottom:0;padding-left:38px}
:root[data-design="route"] .dayend{display:flex;align-items:center;gap:16px;position:relative;padding:12px 0 6px;font:500 14px/1.3 var(--fd);color:var(--muted)}
:root[data-design="route"] .dayend::before{bottom:auto;height:24px}
:root[data-design="route"] .dayend i{width:26px;height:26px;margin-left:-2px;border-radius:50%;border:4px solid var(--ink);background:var(--bg);position:relative;z-index:1;flex:none}
:root[data-design="route"] .dayend i::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ink)}
:root[data-design="route"] .dayend.full{color:var(--ink)}
:root[data-design="route"] .dayend.full i{background:var(--mark);border-color:var(--mark)}
:root[data-design="route"] .dayend.full i::before{background:var(--on-brand);inset:7px}
:root[data-design="route"] .notice{border-radius:20px;border:0;background:var(--faint)}

/* Dashboard & goal */
:root[data-design="route"] .chart.route .zone{fill:transparent}
:root[data-design="route"] .chart.route .zone.zg{fill:var(--faint)}
:root[data-design="route"] .chart.route .zline{stroke:var(--line)}
:root[data-design="route"] .chart.route .zl{fill:var(--muted);font:600 11px var(--fd)}
:root[data-design="route"] .chart .rt-done{fill:none;stroke:var(--acc);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
:root[data-design="route"] .chart .rt-plan{fill:none;stroke:var(--mark2);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 12}
:root[data-design="route"] .chart .rt-conn{stroke:var(--acc);stroke-width:3;stroke-dasharray:2 6;stroke-linecap:round}
:root[data-design="route"] .chart .rt-today{stroke:var(--line);stroke-width:1.5}
:root[data-design="route"] .chart .st circle{fill:var(--bg);stroke:var(--acc);stroke-width:4}
:root[data-design="route"] .chart .st-next circle{stroke:var(--mark2);stroke-width:3}
:root[data-design="route"] .chart .st-goal circle{stroke:var(--ink);stroke-width:5}
:root[data-design="route"] .chart .st-goal .st-goal-in{fill:var(--ink);stroke:none}
:root[data-design="route"] .chart .st-goal-ring{fill:none!important;stroke:var(--ink)!important;stroke-width:2!important;opacity:0}
:root[data-design="route"] .chart .sv{fill:var(--ink);font:600 13px var(--fd)}
:root[data-design="route"] .chart .sm{fill:var(--muted);font:500 11px var(--fd)}
:root[data-design="route"] .chart .sg{fill:var(--ink);font:600 13px var(--fd)}
:root[data-design="route"] .chart .rt-here circle{fill:var(--ink);stroke:var(--bg);stroke-width:3}
:root[data-design="route"] .chart .rt-here rect{fill:var(--ink)}
:root[data-design="route"] .chart .rt-here text{fill:var(--bg);font:600 10.5px var(--fd)}
:root[data-design="route"] .k-rt{stroke:var(--acc);stroke-width:5}
:root[data-design="route"] .k-rp{stroke:var(--mark2);stroke-width:4;stroke-dasharray:.1 6}
:root[data-design="route"] .chart .ln{stroke-width:3}
:root[data-design="route"] .cell{border-radius:50%}
:root[data-design="route"] .lg{border-radius:50%}
:root[data-design="route"] .hb-b{height:10px}
:root[data-design="route"] .hb-b i{border-radius:5px}
:root[data-design="route"] .hb-b .g{background:var(--faint)}
:root[data-design="route"] .hb-b .f{background:radial-gradient(circle,var(--bg) 0 1.8px,transparent 2.4px) 5px 50%/16px 10px repeat-x,var(--c,var(--mark))}
:root[data-design="route"] .path{border-top:0;position:relative}
:root[data-design="route"] .path::before{content:"";position:absolute;left:8px;right:8px;top:9px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--acc) 0 50%,var(--mark2) 50%)}
:root[data-design="route"] .path div{padding-top:30px;position:relative}
:root[data-design="route"] .path div::before{content:"";position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:4px solid var(--acc);box-sizing:border-box}
:root[data-design="route"] .path div:last-child::before{border-color:var(--ink);width:22px;height:22px;top:0}
:root[data-design="route"] .scale{border-top:0;margin-top:6px}
:root[data-design="route"] .scale div{border-left:0;border-radius:8px;padding:8px}
:root[data-design="route"] .scale div.hit{background:var(--acc);color:var(--on-acc)}
:root[data-design="route"] .scale div.tg{box-shadow:inset 0 0 0 2px var(--ink)}
:root[data-design="route"] .export,:root[data-design="route"] .quote{border-color:var(--acc)}
:root[data-design="route"] .sklegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:var(--s1);color:var(--muted);margin-top:8px}

/* ===== motion (route only, and only if the viewer allows it) ===== */
@keyframes rt-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rt-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rt-growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rt-fade{from{opacity:0}to{opacity:1}}
@keyframes rt-pop{0%{transform:scale(.3)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes rt-ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes rt-ring-in{from{stroke-dashoffset:100}}
@keyframes rt-rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: no-preference){
  :root[data-design="route"] .anim .chart .ln,:root[data-design="route"] .anim .chart .rt-done{stroke-dasharray:1;stroke-dashoffset:1;animation:rt-draw 1.3s cubic-bezier(.3,.7,.2,1) .15s forwards}
  :root[data-design="route"] .anim .chart .pl,:root[data-design="route"] .anim .chart .fc,:root[data-design="route"] .anim .chart .wash,:root[data-design="route"] .anim .chart .trend,
  :root[data-design="route"] .anim .chart .rt-plan,:root[data-design="route"] .anim .chart .rt-conn,:root[data-design="route"] .anim .chart .lab,:root[data-design="route"] .anim .chart .sv,
  :root[data-design="route"] .anim .chart .sm,:root[data-design="route"] .anim .chart .sg{animation:rt-fade .7s 1s both}
  :root[data-design="route"] .anim .chart .col path{transform-box:fill-box;transform-origin:50% 100%;animation:rt-grow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 26ms + .1s)}
  :root[data-design="route"] .anim .chart .st{transform-box:fill-box;transform-origin:50% 50%;animation:rt-pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 110ms + .25s)}
  :root[data-design="route"] .anim .chart .st-goal-ring{transform-box:fill-box;transform-origin:50% 50%;animation:rt-ring 1.3s ease-out 1.6s 2}
  :root[data-design="route"] .anim .cell{animation:rt-fade .5s both;animation-delay:calc(var(--w,0) * 24ms)}
  :root[data-design="route"] .anim .hb-b i{transform-origin:0 50%;animation:rt-growx .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms + .15s)}
  :root[data-design="route"] .anim .bar.segs i{transform-origin:0 50%;animation:rt-growx .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 140ms + .2s)}
  :root[data-design="route"] .anim .item-r::before{transform-origin:50% 0;animation:rt-grow .45s ease-out both;animation-delay:calc(var(--i,0) * 110ms + .1s)}
  :root[data-design="route"] .anim .item-r .box{animation:rt-pop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 110ms + .2s)}
  :root[data-design="route"] .anim .dayend i{animation:rt-pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 110ms + .25s)}
  :root[data-design="route"] .anim .wd .mk{animation:rt-pop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 60ms + .15s)}
  :root[data-design="route"] .anim .hero-n{animation:rt-rise .6s cubic-bezier(.2,.8,.2,1) both}
  :root[data-design="route"] .anim .hr-fg{animation:rt-ring-in 1.1s cubic-bezier(.3,.7,.2,1) .2s both}
  /* answers to an action */
  :root[data-design="route"] .item-r.just .box{animation:rt-pop .45s cubic-bezier(.2,.8,.2,1)}
  :root[data-design="route"] .item-r.just::before{transform-origin:50% 0;animation:rt-grow .5s cubic-bezier(.2,.8,.2,1)}
  :root[data-design="route"] .bar.segs i.just{transform-origin:0 50%;animation:rt-growx .55s cubic-bezier(.2,.8,.2,1)}
  :root[data-design="route"] .dayend.just i{animation:rt-pop .6s cubic-bezier(.2,.8,.2,1) .25s both}
  :root[data-design="route"] .dayend.just i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--mark);animation:rt-ring 1s ease-out .5s 2 both}
  :root[data-design="route"] .wd.just .mk{animation:rt-pop .6s cubic-bezier(.2,.8,.2,1) .3s both}
  :root[data-design="route"] .scale div{transition:background-color .3s,color .3s}
}

/* plan update card */
#t-upd:empty{display:none}
.upd-banner{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:14px 18px;border-radius:18px;background:var(--faint);font-size:var(--s2)}
.upd-banner .link{color:var(--ink)}
:root[data-design="route"] #p-today > #t-upd{order:-1}
.upd-list{margin:0;padding-left:20px;display:grid;gap:8px;font-size:var(--s2);max-width:62ch}
.upd-list li::marker{color:var(--muted)}
.upd-btns{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-top:20px}
.upd-btns .link{font-size:var(--s2)}

/* ===== more motion & graphics ===== */
.nav{position:sticky}
.nav-ind{display:none}
:root[data-design="route"] .nav-ind{display:block;position:absolute;left:0;bottom:-1px;height:3px;width:0;border-radius:2px;background:var(--acc);transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s cubic-bezier(.2,.8,.2,1)}
:root[data-design="route"] .nav button[aria-selected="true"]{border-bottom-color:transparent}
:root[data-design="route"] .wk-c{display:grid;gap:6px;flex:1;min-width:0;color:var(--muted)}
:root[data-design="route"] .wkbar{display:flex;gap:2px;height:8px;min-width:8px}
:root[data-design="route"] .wkbar i{border-radius:4px;min-width:3px}
.wkbar{display:none}
:root[data-design="route"] .wkbar{display:flex}
:root[data-design="route"] .burst{position:absolute;left:11px;top:27px;width:0;height:0;pointer-events:none;z-index:4}
:root[data-design="route"] .dayend .burst{left:11px;top:25px}
:root[data-design="route"] .burst i{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--mark));animation:rt-burst .8s cubic-bezier(.15,.75,.25,1) both}
@keyframes rt-burst{0%{transform:translate(0,0) scale(1.1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes rt-slide-r{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes rt-slide-l{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}
@keyframes rt-flow{to{stroke-dashoffset:-24.2}}
@keyframes rt-pulse{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes rt-flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes rt-tip{from{opacity:0;transform:translateY(4px) scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: no-preference){
  :root[data-design="route"] .sl-r{animation:rt-slide-r .42s cubic-bezier(.2,.8,.2,1) both}
  :root[data-design="route"] .sl-l{animation:rt-slide-l .42s cubic-bezier(.2,.8,.2,1) both}
  :root[data-design="route"] .anim .chart .rt-plan{animation:rt-fade .7s 1s both,rt-flow 1.5s linear 1.2s 3}
  :root[data-design="route"] .anim .chart .rt-here{animation:rt-fade .45s 1.6s both}
  :root[data-design="route"] .anim .chart .rt-train{animation:none}
  :root[data-design="route"] .anim .path::before{transform-origin:0 50%;animation:rt-growx 1s cubic-bezier(.2,.8,.2,1) .1s both}
  :root[data-design="route"] .anim .path div::before{animation:rt-pop .45s cubic-bezier(.2,.8,.2,1) both}
  :root[data-design="route"] .anim .path div:nth-child(1)::before{animation-delay:.1s}
  :root[data-design="route"] .anim .path div:nth-child(2)::before{animation-delay:.5s}
  :root[data-design="route"] .anim .path div:nth-child(3)::before{animation-delay:.9s}
  :root[data-design="route"] .anim .scale div.hit,:root[data-design="route"] .anim .scale div.tg{animation:rt-pop .5s cubic-bezier(.2,.8,.2,1) .7s both}
  :root[data-design="route"] .anim .wkbar{transform-origin:0 50%;animation:rt-growx .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms + .1s)}
  :root[data-design="route"] .anim .lg{animation:rt-pop .4s both .2s}
  :root[data-design="route"] .hero.celebrate .hero-ring-w{animation:rt-pulse .8s cubic-bezier(.2,.8,.2,1)}
  :root[data-design="route"] .hero.celebrate::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 78% 50%,rgba(255,255,255,.38),transparent 62%);animation:rt-flash 1.2s ease-out both}
  :root[data-design="route"] .tip-in{animation:rt-tip .16s ease-out}
  :root[data-design="route"] .btn,:root[data-design="route"] .icon,:root[data-design="route"] .seg button,:root[data-design="route"] .box,:root[data-design="route"] .cell{transition:transform .14s ease,background-color .25s,color .25s}
  :root[data-design="route"] .btn:active,:root[data-design="route"] .icon:active,:root[data-design="route"] .seg button:active{transform:scale(.94)}
  :root[data-design="route"] .item:active .box{transform:scale(.88)}
  :root[data-design="route"] .cell:not(:disabled):hover{transform:scale(1.4)}
  :root[data-design="route"] .hb:hover .hb-b .f{filter:brightness(1.08)}
}
:root[data-design="route"] .days button{border-radius:999px;transition:background-color .2s,color .2s,border-color .2s}
:root[data-design="route"] .days button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
:root[data-design="route"] .sks button{border-radius:999px;display:inline-flex;align-items:center;gap:6px;transition:border-color .2s,color .2s}
:root[data-design="route"] .sks button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line)}
:root[data-design="route"] .sks button[aria-pressed="true"]{border-color:var(--c);color:var(--ink)}
:root[data-design="route"] .sks button[aria-pressed="true"]::before{background:var(--c)}
:root[data-design="route"] .ed-name{font-family:var(--fd)!important;font-weight:600!important;font-size:18px!important}
:root[data-design="route"] .chart .rt-train circle{fill:var(--ink);stroke:var(--bg);stroke-width:3}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">
  <header class="hdr">
    <p class="brand">Английский</p>
    <span class="left" id="left"></span>
  </header>
  <nav class="nav" role="tablist" aria-label="Разделы"><span class="nav-ind" aria-hidden="true"></span>
    <button role="tab" id="tab-today" data-tab="today">Сегодня</button>
    <button role="tab" id="tab-dash" data-tab="dash">Дашборд</button>
    <button role="tab" id="tab-tests" data-tab="tests">Цель</button>

  </nav>
  <div class="status" id="status" hidden></div>

  <section class="screen" id="p-today" role="tabpanel" aria-labelledby="tab-today">
    <div id="t-upd"></div>
    <div class="hero">
      <div class="hero-n" id="d-num"></div>
      <div class="hero-t"><b id="d-wd"></b><span id="d-sub"></span></div>
      <div class="hero-ring-w" aria-hidden="true"><svg class="hero-ring" viewBox="0 0 80 80"><circle class="hr-bg" cx="40" cy="40" r="33"/><circle class="hr-fg" id="d-ring" cx="40" cy="40" r="33" pathLength="100"/></svg><span id="d-pct"></span></div>
      <div class="hero-nav">
        <button type="button" class="icon" id="nav-prev" data-nav="-1" aria-label="Предыдущий день"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
        <button type="button" class="icon" id="nav-next" data-nav="1" aria-label="Следующий день"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
      </div>
    </div>
    <div id="t-main">
      <div class="meter" id="t-meter"></div>

      <textarea class="plain" id="t-note" rows="2" placeholder="Что сделали, что получилось, что было трудно"></textarea>

    <div><h2>Неделя</h2><div class="week" id="t-week"></div></div>

  <section class="screen" id="p-dash" role="tabpanel" aria-labelledby="tab-dash" hidden></section>
  <section class="screen" id="p-tests" role="tabpanel" aria-labelledby="tab-tests" hidden></section>
  <section class="screen" id="p-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></section>
</div>

<script>
(() => {
"use strict";
const BUILD = "pwa";

/* ---------- constants ---------- */
const MON_G = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MON_N = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MON_P = ["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
const MON_S = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const WD = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const WD2 = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const ORDER = [1,2,3,4,5,6,0];
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const BANDS = [[1,30,"A1"],[31,40,"A2"],[41,50,"B1"],[51,60,"B2"],[61,70,"C1"],[71,100,"C2"]];
const GOAL_MIN = {A1:1,A2:31,B1:41,B2:51,C1:61,C2:71};
const LINKS = { efset:"https://www.efset.org/ru/", tracktest:"https://app.tracktest.eu/login", dialang:"https://dialang.net/content/als.html" };
const SKILLS = [["listening","Listening"],["reading","Reading"],["speaking","Speaking"],["writing","Writing"],["grammar","Grammar"]];
const SKILL_KEYS = SKILLS.map(s => s[0]);
const DEFAULT_SKILLS = { tutor:["listening","reading","speaking","grammar"], hw:["listening","reading","writing","grammar"], words:["reading","speaking","writing"], grammar:["grammar"], podcast:["listening","speaking"], reading:["reading"] };
/* the first plan («Стратегия копия»): kept so that older trackers can be shown what changed */
const OLD_ITEMS = [
  {id:"tutor",   name:"Репетитор",    min:60, res:"Miro, Teams", days:[3,6]},
  {id:"hw",      name:"ДЗ к встрече", min:40, res:"Miro, грамматика из учебника", days:[2,6]},
  {id:"words",   name:"Новые слова",  min:30, res:"Reword", days:[1,2,3,4,5,6,0]},
  {id:"grammar", name:"Грамматика",   min:30, res:"English Galaxy", days:[1,2,3,4,5]},
  {id:"podcast", name:"Подкаст",      min:45, res:"BBC Learning English, British Council, RealLife", days:[6,0]},
  {id:"reading", name:"Чтение",       min:30, res:"Oxford Bookworms, позже финансовые статьи", days:[1,2,3,4,5]}
].map(it => ({ ...it, skills: DEFAULT_SKILLS[it.id].slice() }));
/* the current plan («Стратегия upd 25.10») */
const NEW_ITEMS = [
  {id:"tutor",   name:"Репетитор",            min:60, res:"Miro, Teams", days:[3,6], skills:["listening","reading","speaking","grammar"]},
  {id:"hw",      name:"ДЗ к встрече",         min:40, res:"Miro, грамматика из учебника", days:[2,6], skills:["listening","reading","writing","grammar"]},
  {id:"grammar", name:"Занятия в приложении", min:60, res:"English Galaxy, после работы", days:[1,2,3,4,5,0], skills:["grammar","reading","writing"]},
  {id:"words",   name:"Слова из подкастов",   min:20, res:"Reword: повторяю слова, записанные на подкастах", days:[1,3,4], skills:["reading","speaking","writing"]},
  {id:"podcast", name:"Подкасты",             min:60, res:"По порядку: BBC Learning English, RealLife, British Council", days:[0], skills:["listening","speaking"]},
  {id:"reading", name:"Чтение",               min:50, res:"Oxford Bookworms, позже финансовые статьи; в метро", days:[1,2,3,4,5], skills:["reading"]}
];
const DEFAULT_ITEMS = NEW_ITEMS;
const DEFAULT_CFG = { start:"2026-10-19", end:"2027-06-06", tests:{on:true, from:1, to:5, testMin:60, essayMin:60}, goalLevel:"", goalScore:null, cal:{ wk:"19:00", we:"11:00", alarm:false, times:{} }, applied:["upd-2510"] };
const design = "route";
document.documentElement.dataset.design = design;
const KEY = "eng-june-v2", KEY_V1 = "eng-june-v1", KEY_TAB = "eng-june-tab", KEY_BACKUP = "eng-june-last-backup";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); };
const isoOf = d => d.toISOString().slice(0, 10);
const add = (s, n) => { const d = toD(s); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
const dow = s => toD(s).getUTCDay();
const mon = s => Number(s.slice(5, 7)) - 1;
const dnum = s => Number(s.slice(8, 10));
const diff = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const isISO = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(toD(s)) && isoOf(toD(s)) === s;
function todayISO(){ const n = new Date(); return n.getFullYear() + "-" + pad(n.getMonth()+1) + "-" + pad(n.getDate()); }
const clone = o => JSON.parse(JSON.stringify(o));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function plural(n, f){ const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; }
const DAYW = ["день","дня","дней"];
const hrs = m => String(Math.round(m / 6) / 10).replace(".", ",");
const clampInt = (v, lo, hi, def) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def; };
const fmtDate = s => `${dnum(s)} ${MON_G[mon(s)]} ${s.slice(0,4)}`;
const fmtShort = s => `${dnum(s)} ${MON_G[mon(s)]}`;
const range = (a, b) => mon(a) === mon(b) ? `${dnum(a)}–${dnum(b)} ${MON_S[mon(b)]}` : `${dnum(a)} ${MON_S[mon(a)]} – ${dnum(b)} ${MON_S[mon(b)]}`;
const levelOf = sc => { const v = Number(sc); if (!v) return ""; for (const [lo,hi,l] of BANDS) if (v >= lo && v <= hi) return l; return ""; };
const newId = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const isHM = s => typeof s === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
const toMin = s => Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
const hm = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const fmt1 = v => String(Math.round(v * 10) / 10).replace(".", ",");

/* ---------- state ---------- */
function fresh(){ return { v:2, cfg:clone(DEFAULT_CFG), plans:[{from:DEFAULT_CFG.start, items:clone(DEFAULT_ITEMS)}], days:{}, tests:{} }; }
function normItem(it){
  if (!it || typeof it !== "object") return null;
  const id = typeof it.id === "string" && /^[\w-]{1,40}$/.test(it.id) ? it.id : newId();
  return { id, name:String(it.name || "Занятие").slice(0, 60), min:clampInt(it.min, 5, 600, 30), res:String(it.res || "").slice(0, 200),
    days: Array.isArray(it.days) ? [...new Set(it.days.map(Number).filter(d => d >= 0 && d <= 6))] : [],
    skills: Array.isArray(it.skills) ? [...new Set(it.skills.filter(s => SKILL_KEYS.includes(s)))] : (DEFAULT_SKILLS[id] || []).slice() };
}
function normTests(t){
  const o = { on: !(t && t.on === false), from:clampInt(t && t.from, 1, 28, 1), to:clampInt(t && t.to, 1, 28, 5),
    testMin:clampInt(t && t.testMin, 0, 600, 60), essayMin:clampInt(t && t.essayMin, 0, 600, 60) };
  if (o.to < o.from) o.to = o.from;
  return o;
}
function normalize(r){
  const s = fresh();
  if (!r || typeof r !== "object") return s;
  const c = r.cfg;
  if (c && typeof c === "object") {
    if (isISO(c.start)) s.cfg.start = c.start;
    if (isISO(c.end) && c.end >= s.cfg.start) s.cfg.end = c.end; else if (s.cfg.end < s.cfg.start) s.cfg.end = add(s.cfg.start, 230);
    s.cfg.tests = normTests(c.tests);
    if (LEVELS.includes(c.goalLevel)) s.cfg.goalLevel = c.goalLevel;
    const g = Number(c.goalScore); s.cfg.goalScore = g >= 1 && g <= 100 ? Math.round(g) : null;
    if (s.cfg.goalScore) s.cfg.goalLevel = levelOf(s.cfg.goalScore); else if (s.cfg.goalLevel) s.cfg.goalScore = GOAL_MIN[s.cfg.goalLevel];
    const cl = c.cal && typeof c.cal === "object" ? c.cal : {};
    s.cfg.cal = { wk: isHM(cl.wk) ? cl.wk : "19:00", we: isHM(cl.we) ? cl.we : "11:00", alarm: !!cl.alarm, times:{} };
    if (cl.times && typeof cl.times === "object") for (const [k, v] of Object.entries(cl.times)) if (/^[\w-]{1,40}$/.test(k) && isHM(v)) s.cfg.cal.times[k] = v;
    s.cfg.applied = Array.isArray(c.applied) ? c.applied.filter(x => typeof x === "string").slice(0, 20) : [];   // trackers made before the update see the new schedule offered
    const cu = c.catchup;
    s.cfg.catchup = cu && isISO(cu.from) && isISO(cu.to) && Array.isArray(cu.days) ? { from:cu.from, to:cu.to, min:clampInt(cu.min, 5, 600, 30), days:cu.days.map(Number).filter(d => d >= 0 && d <= 6) } : null;
  }
  if (Array.isArray(r.plans)) {
    const ps = r.plans.filter(p => p && isISO(p.from) && Array.isArray(p.items)).map(p => ({ from:p.from, items:p.items.map(normItem).filter(Boolean) }));
    if (ps.length) s.plans = ps.sort((a, b) => a.from < b.from ? -1 : 1);
  }
  if (r.days && typeof r.days === "object") for (const [k, v] of Object.entries(r.days)) {
    if (isISO(k) && v && typeof v === "object") {
      const done = Array.isArray(v.done) ? [...new Set(v.done.filter(x => typeof x === "string"))].slice(0, 60) : [];
      const mins = {}; if (v.mins && typeof v.mins === "object") for (const [id, m] of Object.entries(v.mins)) if (done.includes(id) && Number(m) >= 1) mins[id] = clampInt(m, 1, 600, 1);
      s.days[k] = { done, off: !!v.off, note: typeof v.note === "string" ? v.note.slice(0, 4000) : "", mins };
    }
  }
  if (r.tests && typeof r.tests === "object") for (const [k, v] of Object.entries(r.tests)) if (/^\d{4}-\d{2}$/.test(k) && v && typeof v === "object") s.tests[k] = v;
  return s;
}
function fromV1(r){
  const s = normalize({ days: r && r.days, tests: r && r.tests });
  Object.values(s.tests).forEach(t => { const e = Number(t.efset); if (e >= 1 && e <= 100) t.testDone = true; }); // a score means the test was taken
  s.plans = [{ from:s.cfg.start, items:clone(OLD_ITEMS) }]; s.cfg.applied = [];
  const st = r && r.settings;
  if (st && LEVELS.includes(st.goalLevel)) s.cfg.goalLevel = st.goalLevel;
  if (st && Number(st.goalScore) >= 1 && Number(st.goalScore) <= 100) s.cfg.goalScore = Math.round(Number(st.goalScore));
  return s;
}

let S = fresh(), storageOk = true;
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { S = normalize(JSON.parse(raw)); return; }
    const old = localStorage.getItem(KEY_V1);
    if (old) { S = fromV1(JSON.parse(old)); saveAll(); }
  } catch (e) { storageOk = false; }
}
let saveTimer = null;
function saveAll(){
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch (e) { storageOk = false; }
  renderStatus();
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveAll, 500); }
window.addEventListener("pagehide", () => { if (saveTimer) saveAll(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveTimer) saveAll(); });

/* ---------- derived ---------- */
let D = null;
function derive(){
  const st = S.cfg.start, en = S.cfg.end;
  const days = []; for (let d = st; d <= en; d = add(d, 1)) days.push(d);
  const gStart = add(st, -((dow(st) + 6) % 7));
  const weeks = []; for (let w = gStart; w <= en; w = add(w, 7)) weeks.push(Array.from({length:7}, (_, i) => add(w, i)));
  D = { days, gStart, weeks, checks: buildChecks() };
}
function buildChecks(){
  const t = S.cfg.tests; if (!t.on) return [];
  const st = S.cfg.start, en = S.cfg.end, out = [];
  const e0 = add(st, 6);
  out.push({ k:st.slice(0, 7), label:"Старт", m:mon(st) + 1, win:[st, e0 > en ? en : e0] });
  let y = Number(st.slice(0, 4)), m = Number(st.slice(5, 7));
  for (let i = 0; i < 40; i++) {
    m++; if (m > 12) { m = 1; y++; }
    const k = y + "-" + pad(m), a = `${k}-${pad(t.from)}`;

/* cumulative hours: plan, fact, forecast */
function burnSVG(){
  const t = todayISO(), n = D.days.length;
  const chPlan = {}, chFact = {};
  D.checks.forEach(c => {
    chPlan[c.win[1]] = (chPlan[c.win[1]] || 0) + checkMin();
    const f = checkFact(c.k);
    if (f) { let d = c.win[0] <= t ? c.win[0] : t; d = clampDay(d); chFact[d] = (chFact[d] || 0) + f; }
  });
  const ti = t < S.cfg.start ? -1 : t > S.cfg.end ? n - 1 : D.days.indexOf(t);
  let cp = 0, cf = 0; const plan = [], fact = [];
  D.days.forEach((d, i) => { cp += planMin(d) + (chPlan[d] || 0); plan.push(cp); if (i <= ti) { cf += factMin(d) + (chFact[d] || 0); fact.push(cf); } });
  const pace = ti >= 0 && plan[ti] > 0 ? cf / plan[ti] : null;
  const fc = pace !== null && ti < n - 1 ? plan.map((v, i) => i < ti ? null : cf + (v - plan[ti]) * pace) : null;
  const W = chartW(), H = 240, L = 34, R = 70, T = 14, B = 24, w = W - L - R, h = H - T - B;
  const maxV = Math.max(plan[n - 1] || 0, fc ? fc[n - 1] : 0, cf, 60);
  const step = niceStep(maxV / 60 / 4) * 60, top = Math.ceil(maxV / step) * step;
  const x = i => L + (n > 1 ? i * w / (n - 1) : 0), y = v => T + h - v / top * h;

  for (let v = 0; v <= top + 0.5; v += step) o += `<line class="gl" x1="${L}" x2="${L + w}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${Math.round(v / 60)}</text>`;
  D.days.forEach((d, i) => { if (dnum(d) === 1 || (i === 0 && dnum(d) <= 15)) o += `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : "middle"}">${MON_S[mon(d)]}</text>`; });
  if (ti >= 0 && ti < n - 1) o += `<line class="today" x1="${x(ti).toFixed(1)}" x2="${x(ti).toFixed(1)}" y1="${T}" y2="${T + h}"/>`;

  if (ti >= 0 && fact.length) { const fx = x(ti), fy = y(cf); o += `<circle class="dot" cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="4"/>`; o += `<text class="lab" x="${(fx - 8).toFixed(1)}" y="${(fy - 10).toFixed(1)}" text-anchor="${fx - L > 60 ? "end" : "start"}">${hrs(cf)} ч</text>`; }
  o += `<line class="xh" id="bx" x1="0" x2="0" y1="${T}" y2="${T + h}" visibility="hidden"/><circle class="dot" id="bd" r="4" visibility="hidden"/>`;
  o += `<rect class="hit" data-burn="1" x="${L}" y="${T}" width="${w}" height="${h}"/>`;
  burn = { plan, fact, fc, ti, n, W, L, w, x, y };

/* generic columns: plan as a ghost, fact as ink on top of it */
function colsSVG(items, opt){

    o += `<rect class="hit" x="${(L + band * i).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${h}"/></g>`;

/* comparison of equal spans: this week vs the previous one and a usual week; this month vs the previous one */

}
function cmpTable(heads, cells, note){

/* tooltip */
const tipEl = document.createElement("div"); tipEl.className = "tip"; tipEl.hidden = true; tipEl.setAttribute("role", "status"); document.body.appendChild(tipEl);
function showTip(lines, x, y){
  if (tipEl.hidden && motionOK()) { tipEl.classList.remove("tip-in"); void tipEl.offsetWidth; tipEl.classList.add("tip-in"); }
  tipEl.replaceChildren(...lines.map((l, i) => { const d = document.createElement("div"); d.textContent = l; if (i === 0) d.className = "tip-h"; return d; }));
  tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 14;
  if (left + r.width > window.innerWidth - 8) left = Math.max(8, x - r.width - 14);
  if (top < 8) top = y + 18;
  tipEl.style.left = left + "px"; tipEl.style.top = top + "px";
}
function hideTip(){ tipEl.hidden = true; }
function hideCross(){ const a = document.getElementById("bx"), b = document.getElementById("bd"); if (a) a.setAttribute("visibility", "hidden"); if (b) b.setAttribute("visibility", "hidden"); }
function onDashPointer(e){
  const hb = e.target.closest && e.target.closest("[data-burn]");
  if (hb && burn) {
    const box = hb.ownerSVGElement.getBoundingClientRect(), sc = burn.W / box.width;
    const px = (e.clientX - box.left) * sc;
    let i = Math.round((px - burn.L) / (burn.w / Math.max(1, burn.n - 1))); i = Math.max(0, Math.min(burn.n - 1, i));
    const xx = burn.x(i).toFixed(1);
    const bx = document.getElementById("bx"), bd = document.getElementById("bd");
    bx.setAttribute("x1", xx); bx.setAttribute("x2", xx); bx.setAttribute("visibility", "visible");
    const v = i <= burn.ti ? burn.fact[i] : (burn.fc ? burn.fc[i] : burn.plan[i]);
    bd.setAttribute("cx", xx); bd.setAttribute("cy", burn.y(v).toFixed(1)); bd.setAttribute("visibility", "visible");
    const lines = [fmtDate(D.days[i])];
    if (i <= burn.ti) lines.push(`Факт: ${hrs(burn.fact[i])} ч`);
    lines.push(`План: ${hrs(burn.plan[i])} ч`);
    if (i > burn.ti && burn.fc) lines.push(`Прогноз: ${hrs(burn.fc[i])} ч`);
    showTip(lines, e.clientX, e.clientY); return;
  }
  hideCross();
  const tg = e.target.closest && e.target.closest("[data-tip]");
  if (tg) showTip(tg.dataset.tip.split("\n"), e.clientX, e.clientY); else hideTip();
}

  const LO = 20, HI = 90, cl = v => Math.max(LO, Math.min(HI, v));
  const y = v => Tp + (1 - (cl(v) - LO) / (HI - LO)) * h, x = i => L + 14 + (N > 1 ? i * ((w - 28) / (N - 1)) : (w - 28) / 2);

    const y1 = y(hi), y2 = y(lo - 1);
    if (i % 2 === 1) o += `<rect class="band" x="${L}" y="${y1.toFixed(1)}" width="${w}" height="${(y2 - y1).toFixed(1)}"/>`;
    o += `<text class="ax" x="${W - R + 6}" y="${((y1 + y2) / 2 + 4).toFixed(1)}">${l}</text>`;
  });
  [30,40,50,60,70].forEach(v => { o += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  const step = Math.ceil(N / Math.max(2, Math.floor(w / 46)));
  D.checks.forEach((c, i) => { if (i % step === 0 || i === N - 1) o += `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${i === 0 ? "старт" : i === N - 1 && N > 1 ? "итог" : MON_S[c.m - 1]}</text>`; });
  if (g.score) o += `<line class="goal" x1="${L}" x2="${W - R}" y1="${y(g.score)}" y2="${y(g.score)}"/><text class="ax" x="${L + 4}" y="${y(g.score) - 6}">цель ${g.score}</text>`;
  const ms = milestones();

  const pts = D.checks.map((c, i) => { const v = testState(c.k).efset; return v ? [x(i), y(v), v] : null; }).filter(Boolean);
  if (pts.length > 1) o += `<polyline class="ln" pathLength="1" points="${pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}"/>`;
  pts.forEach(p => { o += `<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/><text class="pv" x="${p[0].toFixed(1)}" y="${(p[1] - 10).toFixed(1)}" text-anchor="middle">${p[2]}</text>`; });
  if (!pts.length) o += `<text class="empty" x="${L + w / 2}" y="${Tp + h / 2 + 4}" text-anchor="middle">Здесь появится линия после первого теста</text>`;

async function saveBackup(){

function slotsFor(items){
  const cal = S.cfg.cal, out = [];
  ORDER.forEach(wd => {
    let cur = toMin(isWeekend(wd) ? cal.we : cal.wk);
    const its = items.filter(it => it.days.includes(wd));
    const fixed = its.filter(it => cal.times[it.id]).map(it => { const a = toMin(cal.times[it.id]); return [a, a + it.min]; });
    its.forEach(it => {
      const own = cal.times[it.id];
      let st;
      if (own) st = toMin(own);
      else { // next free slot that does not overlap an activity with its own time
        for (let moved = true, guard = 0; moved && guard < 20; guard++) { moved = false; for (const [a, b] of fixed) if (cur < b && cur + it.min > a) { cur = b; moved = true; } }
        st = cur; cur += it.min;

      st = Math.max(0, Math.min(st, 1439 - Math.min(it.min, 1439)));
      let g = out.find(o => o.it.id === it.id && o.start === st);

const calFrom = () => { const t = todayISO(); return t < S.cfg.start ? S.cfg.start : t; };

    if (vs > ve) return;

/* ---------- catch-up plan ----------
   Debt = planned minutes of past days − minutes done on them. A catch-up is an ordinary activity «Догонка»
   added to the plan versions of the chosen window, on the weekdays with the lightest load. */
const CU_ID = "catchup";
let cuWeeks = 2, cuMsg = "";
function debtInfo(){
  const t = todayISO(); let p = 0, f = 0; const by = {};
  D.days.forEach(d => {
    if (d >= t) return;
    p += planMin(d); f += factMin(d);
    scheduled(d).forEach(it => { if (it.id === CU_ID) return; const m = it.min - doneMin(d, it.id); if (m > 0) by[it.id] = (by[it.id] || 0) + m; });

function catchupActive(){ const c = S.cfg.catchup; return c && c.to >= todayISO() ? c : null; }
function catchupProposal(weeks){
  const info = debtInfo(), debt = info.debt; if (debt < 15) return null;
  const t = todayISO(); let from = add(t, 1); if (from < S.cfg.start) from = S.cfg.start;
  if (from > S.cfg.end) return null;
  let to = weeks ? add(from, weeks * 7 - 1) : S.cfg.end; if (to > S.cfg.end) to = S.cfg.end;
  const base = planFor(from).items.filter(it => it.id !== CU_ID);
  const load = wd => base.filter(it => it.days.includes(wd)).reduce((a, it) => a + it.min, 0);
  const order = ORDER.slice().sort((a, b) => load(a) - load(b) || ORDER.indexOf(a) - ORDER.indexOf(b));
  const occ = days => { let n = 0; for (let d = from; d <= to; d = add(d, 1)) if (days.includes(dow(d)) && !dayRec(d).off) n++; return n; };

  for (let k = 1; k <= 7; k++) { const ds = order.slice(0, k), n = occ(ds); if (!n) continue; days = ds; per = Math.ceil(debt / n / 5) * 5; if (per <= 45) break; }

  per = Math.min(60, Math.max(10, per));
  const top = Object.entries(info.by).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => itemDef(id, t)).filter(Boolean);

    res: top.length ? "В первую очередь: " + top.map(it => it.name).join(", ") : "", skills: SKILL_KEYS.filter(k => top.some(it => itemSkills(it).includes(k))) };

function ensureVersion(d){ if (!S.plans.some(v => v.from === d)) { S.plans.push({ from:d, items: clone(planFor(d).items) }); S.plans.sort((a, b) => a.from < b.from ? -1 : 1); } }

function catchupHTML(){
